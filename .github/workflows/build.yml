name: Build Release

on:
    workflow_dispatch:
    push:
        branches: [master]

jobs:
    build-linux:
        name: Build for Linux
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable


            - name: Build pipe-only release
              run: cargo build --release --no-default-features --features pipe

            - name: Zip pipe-only release
              run: zip -j fb2epub-pipe-only_linux_x86-64.zip target/release/fb2epub


            - name: Build release
              run: cargo build --release

            - name: Zip release
              run: zip -j fb2epub_linux_x86-64.zip target/release/fb2epub


            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-release.zip
                  path: fb2epub*_linux_x86-64.zip
                  if-no-files-found: error

